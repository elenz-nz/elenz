<!doctype html>
<html lang="en-NZ">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// apply the reader's saved light/dark choice before the page paints
			try { var t = localStorage.getItem('elenz-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
		</script>
		<!-- with JavaScript off, anything marked js-only (empty charts, "Loading") goes, leaving each page's plain line
		     (RES-04). It lives here, not in a page: Svelte builds a page's markup itself on a click between pages, and Chrome
		     then treats a <style> inside <noscript> as a real style, hiding the charts for everyone. -->
		<noscript><style>.js-only { display: none !important; }</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Cloudflare Web Analytics: visitor counts, no cookies; the token is public by design -->
		<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "052b4d2063e946d8ba41bb6f5f953c10"}'></script>
	</body>
</html>
