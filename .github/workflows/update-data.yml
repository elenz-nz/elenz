# Every 5 minutes: fetch new intervals from the EMI real-time dispatch API, rebuild the tracker data,
# and save it to Cloudflare Workers KV, where the site reads it. GitHub runs schedules on a best-effort basis,
# so runs can be a few minutes late; each run fills any intervals a late or skipped run missed.
#
# Secrets (repo Settings → Secrets and variables → Actions): EMI_KEY, CF_ACCOUNT_ID, CF_API_TOKEN.
# The KV namespace id is read from wrangler.jsonc.
name: Update data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'stubzy19/elenz'   # copies of the repo don't run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ingest
            facilities
            wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Update tracker data
        run: python ingest/update.py
        env:
          EMI_KEY: ${{ secrets.EMI_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
