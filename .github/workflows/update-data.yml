# Fetch new intervals from the EMI real-time dispatch API, rebuild the tracker data, and save it to Cloudflare
# Workers KV, where the site reads it. The site's Worker triggers this every 5 minutes through the API
# (workflow_dispatch), because GitHub's own schedule is unreliable for new repositories; the schedule below is a
# backup every 30 minutes. Each run fills any intervals a late or skipped run missed, and saves nothing if no new
# data has arrived.
#
# Secrets (repo Settings → Secrets and variables → Actions): EMI_KEY, CF_ACCOUNT_ID, CF_API_TOKEN.
# The KV namespace id is read from wrangler.jsonc.
name: Update data

on:
  schedule:
    - cron: '17,47 * * * *'   # backup only; the Worker's cron is the main trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'elenz-nz/elenz'   # copies of the repo don't run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ingest
            facilities
            wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Update tracker data
        run: python ingest/update.py
        env:
          EMI_KEY: ${{ secrets.EMI_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
