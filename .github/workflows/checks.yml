# Checks on every pull request and every push to main: the ingest code (syntax and undefined names, then a smoke test
# on a committed one-hour sample of real dispatch data) and the website (type check, tests, build, Worker and browser
# tests).
#
# The ingest and site jobs are required checks on main (ruleset "protect main"): a pull request merges, and so
# deploys the site and the live job's ingest code, only once both pass. Renaming a job means updating the ruleset.
#
# Once per change (design decision, 19 Nov 2026): a branch's push used to run the checks a second time beside its pull
# request's run, on the same commit, so a pull request waited on both and a flaky or stuck browser test in either held
# it up. A newer push to a pull request cancels its run still going. A branch with no pull request gets no checks.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - run: pip install ruff==0.17.6   # pinned, like everything else the checks install
      - name: Syntax errors and undefined names
        run: ruff check ingest analysis --select E9,F63,F7,F82 --output-format github
      - name: Unused imports (ingest only; the analysis scripts are for development)
        run: ruff check ingest --select F401 --output-format github
      - name: Smoke test (live and history paths on a sample)
        run: python ingest/tests/smoke.py
      - name: Method pages (the numbers they quote match the constants in the code)
        run: python ingest/tests/method_constants.py
      - name: Installed capacity (every plant has a row; the site's copy is up to date)
        run: python ingest/capacity.py --check
      - name: Plant files (every tracker plant has one; published facts are sourced; images are licensed)
        run: python ingest/plant_files.py --check
      - name: Plant pages (each page's data file is up to date with its plant file)
        run: python ingest/plant_pages.py --check
      - name: Plant research page (its data is up to date with the plant and leads files)
        run: python ingest/plant_research.py --check

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # check-reviewed.js reads each file's history
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Tests (the tracker's address and share links)
        run: npm test
      - run: npm run build
      - name: Link previews (every public page has og:title, og:description, og:url and an image)
        run: npm run check:previews
      - name: Worker tests (the Worker in Cloudflare's runtime with a local KV store)
        working-directory: worker
        run: |
          npm ci
          npm test
      - name: Browser tests (the built site in Chromium, Firefox and WebKit, Safari's engine, at desktop and phone sizes)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browsers
