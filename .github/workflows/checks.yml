# Checks on every push and pull request: the ingest code (syntax and undefined names, then a smoke test on a
# committed one-hour sample of real dispatch data) and the website (type check, tests and build).
#
# The ingest and site jobs are required checks on main (ruleset "protect main"): a pull request merges, and so
# deploys the site and the live job's ingest code, only once both pass. Renaming a job means updating the ruleset.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt ruff
      - name: Syntax errors and undefined names
        run: ruff check ingest analysis --select E9,F63,F7,F82 --output-format github
      - name: Smoke test (live and history paths on a sample)
        run: python ingest/tests/smoke.py
      - name: Installed capacity (every plant has a row; the site's copy is up to date)
        run: python ingest/capacity.py --check

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Tests (the tracker's address and share links)
        run: npm test
      - run: npm run build
      - name: Link previews (every public page has og:title, og:description, og:url and an image)
        run: npm run check:previews
