# Checks that the site's data is current and raises the alarm when it isn't: opens a GitHub issue (labelled
# stale-data), which GitHub emails to the repository's watchers, and closes it with a comment once the data recovers.
# One issue per outage: no repeat emails while it stays stale.
#
#   live:     newest interval in /data/tracker.json older than LIVE_MINUTES (the live job runs every 5 minutes)
#   history:  newest half-hour in /data/history/index.json older than HISTORY_DAYS (the EA publishes daily dispatch
#             files 1-4 days late, so a few days' lag is normal)
#   trigger:  the Worker's calls to GitHub (/data/status.json) have failed for TRIGGER_MINUTES (it retries once;
#             GitHub drops a single call now and then, and the next one 5 minutes later works)
#   solar:    embedded solar's irradiance (the live file's meta): daylight with none at all (roof_gap), the reserve
#             forecast not refreshed for FORECAST_HOURS (the live job fetches it every 3 hours and it reaches at
#             least a day ahead, so this comes well before the estimate runs out of data), or the satellite more
#             than SATELLITE_HOURS behind (the estimate is then running on the forecast)
#
# The Worker runs this every 15 minutes (workflow_dispatch); the schedule below is a backup in case the Worker
# itself has stopped.
name: Watchdog

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  SITE: https://elenz.co.nz
  LIVE_MINUTES: '60'   # 45 until 7 Nov 2026: the EMI feed's ~50-minute stalls set it off (docs/data-notes.md)
  HISTORY_DAYS: '5'
  REBUILD_DAYS: '12'   # allowed while a full history rebuild is under way (see the history check below)
  FORECAST_HOURS: '6'    # the reserve irradiance forecast is fetched every 3 hours (FORECAST_MAX_AGE in ingest/update.py)
  SATELLITE_HOURS: '6'   # the satellite normally runs about 45 minutes behind; the forecast stands in after 2 hours
  TRIGGER_MINUTES: '15'   # a failed start is reported once failures have lasted this long (GitHub drops one now and then)

jobs:
  check:
    if: github.repository == 'elenz-nz/elenz'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const site = process.env.SITE, now = Date.now();
            const nz = (t) => new Date(t).toLocaleString('en-NZ', { timeZone: 'Pacific/Auckland', dateStyle: 'medium', timeStyle: 'short' });
            const ago = (ms) => ms < 3600e3 ? `${Math.round(ms / 60e3)} minutes` : ms < 172800e3 ? `${(ms / 3600e3).toFixed(1)} hours` : `${(ms / 86400e3).toFixed(1)} days`;
            async function get(path) {
              for (let i = 0; i < 3; i++) {
                try {
                  const r = await fetch(site + path, { headers: { 'cache-control': 'no-cache' } });
                  if (r.ok) return await r.json();
                  if (i === 2) return { error: `HTTP ${r.status}` };
                } catch (e) { if (i === 2) return { error: String(e) }; }
                await new Promise((res) => setTimeout(res, 5000));
              }
            }
            const problems = [];
            const live = await get('/data/tracker.json');
            if (live.error) problems.push(`The live data file can't be read (${live.error}).`);
            else if (now - live.meta.end > process.env.LIVE_MINUTES * 60e3)
              problems.push(`Live data is ${ago(now - live.meta.end)} old (newest interval ${nz(live.meta.end)}).`);
            // embedded solar's irradiance: keys the live job writes since 13 Nov 2026 (skipped on an older file)
            if (!live.error && live.meta && 'fc_at' in live.meta) {
              const m = live.meta, H = 3600e3;
              const reach = m.fc_end && m.fc_end > now ? `the stored forecast reaches ${nz(m.fc_end)}` : 'no stored forecast reaches past now';
              const fcOld = !m.fc_at || now - m.fc_at > process.env.FORECAST_HOURS * H;
              const satOld = !m.sat_end || now - m.sat_end > process.env.SATELLITE_HOURS * H;
              if (m.roof_gap)
                problems.push(`Embedded solar has no irradiance data and shows as zero (satellite ${m.sat_end ? `to ${nz(m.sat_end)}` : 'missing'}; ${reach}).`);
              else if (fcOld)
                problems.push(`The irradiance forecast behind embedded solar ${m.fc_at ? `was last refreshed ${ago(now - m.fc_at)} ago` : 'has never been fetched'}: ${reach}. ` +
                  (satOld ? 'The satellite is behind too, so embedded solar has no data after that.' : 'The satellite is up to date, so nothing shows yet; it matters if the satellite stops as well.'));
              if (satOld && !m.roof_gap)
                problems.push(`Satellite irradiance is ${m.sat_end ? `${ago(now - m.sat_end)} behind` : 'missing'}: embedded solar is running on forecast irradiance.`);
            }
            const hist = await get('/data/history/index.json');
            // while the history job rebuilds every month (months left, progress saved in the last two days), the index
            // is republished only at the end, so it may lag up to REBUILD_DAYS
            const prog = await get('/data/history/progress.json');
            const rebuilding = !prog.error && prog.rebuild_left && prog.rebuild_left.length && prog.at && now - prog.at < 2 * 86400e3;
            const histDays = rebuilding ? process.env.REBUILD_DAYS : process.env.HISTORY_DAYS;
            if (hist.error) problems.push(`The history index can't be read (${hist.error}).`);
            else if (now - hist.end > histDays * 86400e3)
              problems.push(`History is ${ago(now - hist.end)} behind (newest half-hour ${nz(hist.end)})${rebuilding ? `, with ${prog.rebuild_left.length} months still to rebuild` : ''}.`);
            const status = await get('/data/status.json');
            if (!status.error) {
              const lasting = (st) => now - Date.parse(st.since || st.at) >= process.env.TRIGGER_MINUTES * 60e3;
              if (status.result !== 'ok' && lasting(status)) problems.push(`The Worker couldn't start the live job: ${status.result}`);
              if (status.history && status.history.result !== 'ok' && !/no history run/.test(status.history.result) && lasting(status.history))
                problems.push(`The Worker couldn't start the history job: ${status.history.result}`);
            }

            const label = 'stale-data';
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 1 })).data[0];
            const runs = `${context.serverUrl}/${owner}/${repo}/actions`;
            if (problems.length) {
              core.warning(problems.join(' '));
              if (open) return;   // already raised; no repeat emails
              try { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'Raised by the watchdog' }); } catch { /* exists */ }
              await github.rest.issues.create({ owner, repo, labels: [label],
                title: `Elenz data is stale (${nz(now)})`,
                body: [...problems.map((p) => `- ${p}`), '', `Recent job runs: ${runs}`, `Pipeline status: ${site}/data/status.json`, '',
                  'The watchdog closes this issue when the data is current again.'].join('\n') });
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number,
                body: `Recovered: live data to ${nz(live.meta.end)}, history to ${nz(hist.end)}.` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
            } else {
              core.info(`OK: live data to ${nz(live.meta.end)}, history to ${nz(hist.end)}.`);
            }
