# Build the history (half-hourly since 10 Sep 2020) from the EA's daily dispatch files and save it to Cloudflare
# Workers KV, where the site reads it. The site's Worker triggers this every 6 hours through the API
# (workflow_dispatch); each run adds the daily files published since the last run. The first run backfills
# everything (about 2,200 files, 24 GB of downloads), oldest first, and stops at the time budget; the next run
# carries on. Run it by hand from the Actions tab ("History" → "Run workflow"), ticking "rebuild" to rebuild every
# month's JSON from the stored data.
#
# Secrets: CF_ACCOUNT_ID, CF_API_TOKEN (the same ones as the live job). No EMI key needed: the files are public.
name: History

on:
  schedule:
    - cron: '23 3 * * *'   # backup only; the Worker's cron is the main trigger
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild every month from the stored data'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    if: github.repository == 'stubzy19/elenz'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ingest
            facilities
            wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Update history
        run: python -u ingest/history.py --budget 300 ${{ inputs.rebuild && '--rebuild' || '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
