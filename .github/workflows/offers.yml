# Offered capacity (ingest/offered.py): each half-hour's final generator energy offers from the EA's daily offers
# files (EMI BidsAndOffers/Offers, from 2013, published the day after), reduced to offered MW by plant and fuel and
# saved to Cloudflare Workers KV (hist/off/*, hist/offp/*) for the Generation tab's dispatchable headroom chart. The
# site's Worker triggers this every 6 hours, with the history job. Newest months first; the first backfill (~230 GB
# of files since 2013) takes a few days of runs and carries on where the last one stopped. Run it by hand from the
# Actions tab ("Offers" → "Run workflow"); tick "resummarise" after a history rebuild to redo every month's daily
# lowest headroom against the rebuilt output.
#
# Secrets: CF_ACCOUNT_ID, CF_API_TOKEN (the same ones as the live job). No EMI key needed: the files are public.
name: Offers

on:
  workflow_dispatch:
    inputs:
      resummarise:
        description: 'Redo every month''s daily summary (after a history rebuild)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offers
  cancel-in-progress: false

jobs:
  offers:
    if: github.repository == 'elenz-nz/elenz'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ingest
            facilities
            wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Update offered capacity
        run: python -u ingest/offered.py --budget 300 ${{ inputs.resummarise && '--resummarise' || '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
