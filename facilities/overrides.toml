# Curated corrections to the EA plant register (DispatchedGenerationPlant.csv).
#
# The register is updated roughly every six months, so new plant and moved connections show up in the
# dispatch feed before they show up there. The ingester warns about any generating unit it can't map;
# add it here, then rerun.

# Units that dispatch but aren't in the register yet. Key is "POC UNIT".
[units]
"MPE1101 KWK0" = { fuel = "wind",  plant = "Kaiwaikawe Wind Farm" }
"ISL0661 KPS0" = { fuel = "solar", plant = "Kōwhai Park Solar Farm" }
"BRB0331 RUS0" = { fuel = "solar", plant = "Ruakākā Solar Farm" }
# Fuel corrections (Oct 2026). Kinleith is Oji Fibre Solutions' wood-waste cogeneration, not gas (the register says
# Gas). KAW0112 ONU0 is the Kawerau pulp mill's cogeneration (recovery and bark boilers: black liquor and wood, some
# geothermal steam), not a geothermal station (the register says Geothermal). Glenbrook runs on waste gas and heat
# from NZ Steel's ironmaking, not pipeline gas: "waste" (waste heat), zero emissions by convention (UN CDM
# ACM0004; the ironmaking emissions are counted in industrial processes), not renewable.
"KIN0112 KIN0" = { fuel = "bio", plant = "Kinleith" }
"KAW0112 ONU0" = { fuel = "bio", plant = "Kawerau Mill CoGen" }
"GLN0332 GLN0" = { fuel = "waste", plant = "Glenbrook Steel" }

# Dispatched solar farms on local networks that the distributed generation registry (EMI report GUEHMT) also counts.
# The tracker shows them as grid solar, so the rooftop solar model removes them: key = plant, nsp = the Root NSP where
# the registry records it, steps = [month the registry added it (YYYY-MM), MW added] (some arrived in two steps).
# The history job warns when the registry jumps 5 MW or more (systems over 10 kW) at an NSP where a solar unit
# dispatches: add the farm here. Not in the registry yet (check again): Clandeboye (TMK0331), Dannevirke (DVK0111),
# Te Herenga o Te Rā (WAI0331). Tauhei is grid-connected and never in it.
[solar_farms_in_registry]
"Kohirā Solar Farm" = { nsp = "KOE1101TOPEGN", steps = [["2023-11", 23.7]] }
"Lauriston Solar Farm" = { nsp = "ASB0661EASHGN", steps = [["2024-11", 48.3]] }
"Te Puna Mauri ō Omaru at Ruawai" = { nsp = "MTO0331NPOWGN", steps = [["2024-12", 16.8]] }
"Pukenui Solar Farm" = { nsp = "KOE1101TOPEGN", steps = [["2025-05", 20.0]] }
"Rangitaiki Solar Farm" = { nsp = "EDG0331HEDLGN", steps = [["2025-08", 23.9]] }   # ~17 months after commissioning
"Twin Rivers Solar Farm" = { nsp = "KOE1101TOPEGN", steps = [["2025-09", 24.0]] }
"Taiohi Solar Farm" = { nsp = "HLY0331WAIKGN", steps = [["2025-10", 12.8], ["2025-11", 9.6]] }
"Pāmu Rā ki Whitianga Solar Farm" = { nsp = "KPU0661POCOGN", steps = [["2025-11", 23.8]] }
"Papareireiā" = { nsp = "MTO0331NPOWGN", steps = [["2025-11", 9.1], ["2026-04", 8.6]] }
"Omeheu Solar Farm" = { nsp = "EDG0331HEDLGN", steps = [["2026-05", 28.9]] }
"Kōwhai Park Solar Farm" = { nsp = "ISL0661ORONGN", steps = [["2026-07", 160.1]] }

# Register fuel name -> tracker fuel key.
# Huntly Rankine units 1, 2 and 4 burn coal or gas with no change visible to the market, so they are
# "Coal/gas" and get their own layer. Huntly 5 and 6 are gas only (Fuel = Gas in the register).
[fuels]
"Hydro" = "hydro"
"Gas" = "gas"
"Wind" = "wind"
"Geothermal" = "geo"
"Solar" = "solar"
"Electrical energy" = "batt"
"Coal/Gas" = "coal"
"Diesel" = "diesel"

# Battery charging is dispatched as load on a separate unit. Charging unit -> battery unit.
[battery_charging]
RUK99 = "RUK0"   # Ruakākā Energy Park
GLB99 = "GLB0"   # Glenbrook-Ohurua
RHO99 = "RHO0"   # Rotohiko
HLY91 = "HLY11"  # Huntly battery

# Several register entries that are one station.
[plant_names]
"Patea unit 1" = "Pātea"
"Patea unit 2" = "Pātea"
"Patea unit 3" = "Pātea"
"Kaimai 5" = "Kaimai"     # the Kaimai scheme's one dispatched unit; the metered history has the scheme as "kaimai"
"Ngāwhā B" = "Ngāwhā"     # OEC4; the metered history has the whole station (Ngāwhā A and B) as one
"West Wind 1" = "West Wind"   # one farm on two connections (WWD1102, WWD1103), each sometimes carrying most of it
"West Wind 2" = "West Wind"

# Stations the metered history (Generation_MD, before Sep 2020 and for every month it covers) sees only as a whole:
# shown as one plant everywhere, with the register's plants as its units where the dispatch data has them.
[plant_groups]
"Huntly Rankines" = ["Huntly Rankine 1", "Huntly Rankine 2", "Huntly Rankine 3", "Huntly Rankine 4"]
"Stratford" = ["Taranaki Combined Cycle", "Stratford Peaker 1", "Stratford Peaker 2"]
"Waikaremoana" = ["Tuai", "Pirirpaua", "Kaitawa"]
"Te Mihi" = ["Te Mihi 1", "Te Mihi 2"]
"Southdown" = ["Southdown", "Southdown 5"]

# Connection points the feed leaves without an island.
[islands]
OHG1101 = "NI"   # took over Pātea hydro from HWA1101 in June 2026
OHG2201 = "NI"

# Island reference nodes for the headline prices.
[reference_nodes]
NI = "HAY2201"   # Haywards
SI = "BEN2201"   # Benmore

# More price nodes for the Prices page (north to south). Live: the real-time API's bus rows (the daily dispatch
# files lack bus nodes, so intervals filled from them have no price here); history: the EA's final prices.
[price_nodes]
OTA = "OTA2201"  # Ōtāhuhu (Auckland)
WKM = "WKM2201"  # Whakamaru
ISL = "ISL2201"  # Islington (Christchurch)
INV = "INV2201"  # Invercargill

# Load connection points shown separately.
[loads]
tiwai = "TWI2201"

# Owner shown in the site's "By owner" view: register PlantOperator -> owner. Operators not listed here are shown as
# "Other generators". Current owners apply to the whole history.
[owners]
"Meridian Energy Limited" = "Meridian"
"Contact Energy Limited" = "Contact"
"Contact Energy" = "Contact"
"Manawa Energy Limited" = "Contact"       # Contact completed its takeover of Manawa Energy on 11 Jul 2025
"TrustPower Ltd" = "Contact"              # Manawa's former name
"Mercury NZ Limited" = "Mercury"
"Nga Awa Purua Joint Venture" = "Mercury" # operated by Mercury (joint venture with Tauhara North No. 2 Trust)
"Genesis Energy Limited" = "Genesis"
"Nova Energy Limited" = "Nova"

# Owners for plant the register doesn't list yet (see [units] above). Plant name -> owner.
[plant_owners]
"Ruakākā Solar Farm" = "Meridian"
"Kaiwaikawe Wind Farm" = "Mercury"
"Kōwhai Park Solar Farm" = "Contact"
"Mangahao" = "Contact"                    # King Country Energy, part of Manawa
