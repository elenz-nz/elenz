"Te Huka" = ["Tauhara One", "Centennial Drive binary"]
"Ngā Awa Pūrua" = ["Rotokawa II"]

# Site only. What the metered history counts for a plant where it differs from the dispatch data (the live week and
# the weeks since the newest metered month), shown when the tracker drills into the plant. Evidence in
# facilities/metered_plants.csv and analysis/README.md. Plant (shown name) -> note.
[plant_metering]
"Huntly Rankines" = "The metered history has one meter for units 1–4 together, so it shows them as one. The dispatch data (the live week and the weeks since the newest metered month) shows each unit.\nSeptember 2020: Generation_MD has no Huntly that month, so the history uses the grid meter for the whole station, split between units by their offers."
"Huntly 5" = "September 2020: Generation_MD has no Huntly that month, so the history uses the grid meter for the whole station, split between units by their offers."
"Huntly 6" = "September 2020: Generation_MD has no Huntly that month, so the history uses the grid meter for the whole station, split between units by their offers."
"Arapuni" = "Before April 2011 the metered history has one figure for the whole station, under ARI1101. ARI1102 has its own figure from then, so the split by grid connection starts there."
"Stratford" = "The metered history has one meter (SFD2201) for Taranaki Combined Cycle (1998–2025) and the two peakers (from 2011), and until 2001 the old Stratford gas turbines too, so it shows the station whole. The dispatch data (the live week and the weeks since the newest metered month) shows each unit."
"Waikaremoana" = "The metered history has one meter for Tuai, Piripaua and Kaitawa together, so it shows the scheme whole. The dispatch data (the live week and the weeks since the newest metered month) shows each station."
"Te Mihi" = "The metered history has Te Mihi 1 and 2 together, so it shows the station whole. The dispatch data (the live week and the weeks since the newest metered month) shows each unit."
"Southdown" = "The metered history has one meter for the original cogeneration plant and unit 5 together. Southdown closed in January 2016, before the dispatch data starts."
"Ngāwhā" = "The metered history counts the whole station (Ngāwhā A and B). The dispatch data has only Ngāwhā B (OEC4), so in the live week and the weeks since the newest metered month, the rest of the station is filled in as a calculated estimate."
"Teviot" = "The metered history has Teviot's own meter. It is never dispatched, so in the live week and the weeks since the newest metered month, its output is a calculated estimate from its typical day."
"Deep Stream (Waipori A)" = "Since June 2011 one meter (WPG0331) carries Deep Stream and Mahinerangi wind farm together. The metered history splits it 30% Deep Stream, 70% Mahinerangi, their average shares in the dispatch data 2020–26. The dispatch data (the live week and the weeks since the newest metered month) has each plant's own output."
"Mahinerangi (Waipori B)" = "Since June 2011 one meter (WPG0331) carries Mahinerangi and Deep Stream hydro together. The metered history splits it 70% Mahinerangi, 30% Deep Stream, their average shares in the dispatch data 2020–26. The dispatch data (the live week and the weeks since the newest metered month) has each plant's own output."
"Kawerau (Te Ahi O Maui)" = "Since December 2025 one metered code at KAW2201 carries Te Ahi O Maui and TOPP2 together. The metered history splits it 35% Te Ahi O Maui, 65% TOPP2, by their shares in the dispatch data. The dispatch data (the live week and the weeks since the newest metered month) has each plant's own output."
"Kawerau (TOPP2)" = "Since December 2025 one metered code at KAW2201 carries TOPP2 and Te Ahi O Maui together. The metered history splits it 65% TOPP2, 35% Te Ahi O Maui, by their shares in the dispatch data. The dispatch data (the live week and the weeks since the newest metered month) has each plant's own output."
"Kawerau (Onepu)" = "This meter is a whole site's grid connection, not one generator's. It counts power going into the grid there, so it leaves out what the site uses itself and the power it takes from the grid at the same time. Generation_MD has no row for it before 2020, so 2013–2019 use the same figure from the grid meter (Grid_import). The dispatch data (the live week and the weeks since the newest metered month) reads higher."
"Glenbrook Steel" = "Its metered output (meter points GLN0111 and GLN0332) runs about 1.47 times the dispatch data's figure, so expect a step where the metered history meets the dispatch weeks."
