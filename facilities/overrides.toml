# Site only (plant_meta.py -> plants.json; not in the history's rebuild fingerprint). Other names a plant has had or
# goes by, so the tracker's filter and /now's search find it under them, and its drill-down lists them. The members
# of [plant_groups] and the register names in [plant_names] are added automatically (numbered parts of the same
# name, such as "Te Mihi 1" or "Patea unit 2", are left out). Plant (shown name) -> names.
[plant_aka]
"Stratford" = ["TCC"]
"Huntly 5" = ["e3p"]
"Huntly 6" = ["P40"]
"Tekapo A" = ["Takapō A", "Tekapo A"]
"Tekapo B" = ["Takapō B", "Tekapo B"]
"Tararua Wind Farm 3" = ["Tararua Wind Central", "Tararua stage III"]
"Kawerau (Onepu)" = ["Norske Skog CoGen", "Carter Holt Harvey Energy Ltd CoGen", "Kawerau Mill CoGen"]   # the register's names for ONU0, and its name here until BUILD 9
"Paerau Gorge" = ["Patearoa"]   # its metered codes count Patearoa with Paerau (PTR0111, then NSY0331)
"Glenbrook Steel" = ["NZ Steel Glenbrook"]
# newer plants: the project or town names they were announced or built under (checked 31 Oct 2026)
"Kohirā Solar Farm" = ["Kaitaia Solar Farm"]                       # Lodestone's Kaitaia project; Kohirā gifted by Te Rarawa
"Rangitaiki Solar Farm" = ["Edgecumbe Solar Farm"]                  # Lodestone's Edgecumbe project
"Te Herenga o Te Rā Solar Farm" = ["Waiotahe Solar Farm"]           # Lodestone's Waiotahe project; name gifted by Te Ūpokorehe
"Pāmu Rā ki Whitianga Solar Farm" = ["Whitianga Solar Farm"]        # Lodestone; name gifted by Ngāti Hei
"Te Puna Mauri ō Omaru at Ruawai" = ["Ruawai Solar Farm", "Northpower Solar Farm"]
"Papareireiā" = ["Ryman Healthcare Solar Farm"]                     # first developed by Ryman Healthcare and Solar Bay
"Kōwhai Park Solar Farm" = ["Christchurch Airport Solar Farm"]
"Waipipi" = ["Waverley Wind Farm"]                                  # Tilt Renewables, renamed before construction (2019)
