[facts.about]
value = "Ōhakuri opened in 1961 behind an earth dam with concrete intake and spillway structures. Its lake, about 12 km², is the largest on the Waikato River; filling it drowned about two thirds of the Ōrākei Kōrako geothermal area. The four Francis turbines were replaced between 2011 and 2014."
