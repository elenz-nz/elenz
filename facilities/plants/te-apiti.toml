[facts.about]
value = "Te Āpiti stands on farmland just north of the Manawatū Gorge, where the gap between the Ruahine and Tararua ranges funnels the westerly winds. Built from 2003 and fully running in 2004, it was Meridian's first wind farm and the first in New Zealand to connect straight to the national grid, through a 4.5 km line to Transpower's Woodville substation. Its 55 turbines can produce up to 90.75 MW; when they reached the end of their original design life in 2024, Meridian chose to extend their life rather than replace them."
source = ["meridian-te-apiti", "wp-te-apiti"]
