[facts.about]
value = "Tararua Wind Farm stands on about 700 hectares of farmland on the Tararua Range east of Palmerston North, built in three stages. Stage III, 31 Vestas V90 turbines of 3 MW, opened in September 2007 and made Tararua New Zealand's largest wind farm until Turitea was finished in 2023. Unlike the first two stages it connects straight to Transpower's grid, teed off one circuit of the Bunnythorpe to Linton 220 kV line. Trustpower built it; the farm passed to Tilt Renewables in 2016 and to Mercury in 2021."
source = ["mercury-tararua", "tilt-tararua-2020", "wp-tararua-wind-farm", "tilt-intro-2016"]
