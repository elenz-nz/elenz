notes = [
  "Kaiwera Downs is two Elenz plants: stage 1 (43 MW, GOR0331, from Aug 2023) and stage 2 (155 MW, KIW2201, from Apr 2026).",
  "Mercury's wind farm page has slips: stage 1 \"Commissioned in 2013\" (its text says November 2023), \"12km north-west of Gore\" (its fact sheet: 15 km south-east), and stage 2 \"35 wind turbines with an installed capacity of 43MW\" (elsewhere 36 and 155 MW). Facts here use the fact sheet, the September 2026 release and the page's consistent figures.",
  "Previous owners: none for the station. Trustpower proposed the project and won consent in 2008; it passed to Tilt Renewables, and Mercury bought it with Tilt's New Zealand development options in 2021 before building it (Wikipedia; NZX, 3 Aug 2021).",
  "Removed the scheme fact (Southland, from our own register) and published \"Kaiwera Downs Wind Farm\" as the scheme, joining the two stages.",
  "Wind batch 1 (19 Nov 2026): facts checked against the owners' wind farm pages and releases, the EA register and network supply points table, NZX announcements, Wikipedia and Stats NZ boundaries. It has no location yet.",
  "Region: Mercury's fact sheet thanks Environment Southland for stage 2, and Wikipedia's point for the farm has only Southland Region within 5 km; published Southland. District left open.",
  "Resolved: Capacity: Mercury gives 36 turbines and 155 MW, matching Elenz and the register. Elenz starts it on 31 Mar 2026, the register row on 1 Apr 2026; Mercury says it first generated in April 2026.",
