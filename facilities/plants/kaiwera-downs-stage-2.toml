[facts.about]
value = "The second stage of Kaiwera Downs, on land south-east of the first, added 36 Vestas turbines of 4.3 MW (155 MW), taller than stage 1's at 156 m to the blade tip. Mercury went ahead after agreeing in 2024 to supply the Tiwai Point aluminium smelter, began building in June 2024, first generated in April 2026 and opened it in September 2026. With both stages Kaiwera Downs is, at 198 MW, the South Island's largest wind farm."
