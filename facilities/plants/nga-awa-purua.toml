[facts.about]
value = "Ngā Awa Pūrua was built by Mighty River Power, now Mercury, in partnership with the Tauhara North No. 2 Trust, whose members are affiliated to Ngāti Tahu; the trust owns 35% of the station. It stands beside the older Rotokawa station on the Rotokawa field, 14 km northeast of Taupō, and its wells average 2,500 metres deep. Its single triple-flash steam turbine was at one time the largest geothermal turbine in the world, and it first generated in January 2010."
source = ["mercury-nga-awa-purua", "wp-nga-awa-purua", "nzga-rotokawa", "nzga-generation-2023"]
