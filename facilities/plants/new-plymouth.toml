[facts.about]
value = "New Plymouth was a 600 MW station at Port Taranaki, New Zealand's first large thermal station planned to run continuously as baseload. It was designed for coal at first, then changed to burn natural gas or fuel oil after the Maui gas field was found. Its five units came into service between 1974 and 1976, and in later years it ran mostly in dry years. It was mothballed at the end of 2007, ran one unit through 2008's dry winter, and was demolished in 2014–15."
source = "wp-new-plymouth"
grade = "B"
checked = "2026-11-19"

