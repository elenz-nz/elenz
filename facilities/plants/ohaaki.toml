[facts.about]
value = "Ōhaaki stands beside the Waikato River and the Ngāti Tahu marae of the same name, partly on land leased from its Māori owners, and was approved by the government in 1982. Opened on 31 October 1989, it was New Zealand's second geothermal power station and the first to put used geothermal fluid back into the ground. Its 105-metre concrete cooling tower, the first of its kind in the country, cools the condenser water so the river isn't used for cooling. Built for about 108 MW, it now produces much less: the steamfield has declined and one of its high-pressure turbines has been retired."
source = ["tutangata-1986-04", "teara-ohaki-photo", "enz-ohaaki", "contact-ohaaki", "nzga-ohaaki", "wp-ohaaki"]
grade = "B"
checked = "2026-11-19"

