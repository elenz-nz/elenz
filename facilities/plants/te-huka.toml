[facts.about]
value = "Te Huka was the first power station on the Tauhara geothermal field, which lies east of the Waikato River from Wairākei, along the edge of Taupō. It is a binary plant: heat from the geothermal fluid boils a separate working fluid that drives the turbines, and the used geothermal fluid all goes back into the field. Its two units opened in 2010 and were upgraded in 2012, and a third, larger unit, Te Huka 3, was added at Te Huka in 2024."
source = ["contact-te-huka", "nzga-tauhara", "wp-te-huka", "contact-microsoft-2023"]
grade = "B"
checked = "2026-11-19"

