[facts.about]
value = "Wairākei was the world's second geothermal power station and the first to make electricity from wet steam, a mix of steam and hot water drawn from wells north of Taupō; the station stands beside the Waikato River. It began as a joint project with Britain's atomic energy authority to make heavy water as well as power, but the British withdrew in 1956 and the station was built for electricity alone: its first turbine ran in November 1958 and the B station was finished in 1963. A binary plant added in 2005 makes more power from heat left in the separated water. Contact plans to retire most of the station once Te Mihi Stage 2 is running, expected in 2027, and to close the rest by June 2031, when its resource consent ends."
source = ["teara-geothermal-2", "nzga-wairakei", "enz-wairakei", "contact-wairakei-2024"]
grade = "B"
checked = "2026-11-19"

