[facts.about]
value = "Cobb stands where the Cobb River meets the Tākaka, on the edge of Kahurangi National Park in Golden Bay. Its water falls almost 600 m from the storage lake to the powerhouse, the greatest head of any power station in New Zealand, so a small flow makes a lot of power. A private company planned the scheme in the 1930s but could not raise the money; the government took it over, first power came in 1944, and a storage dam was finished in 1954. Until 1955, when a line from Stoke joined the region to the South Island grid, Cobb supplied Nelson and Tasman on its own."
source = ["contact-cobb", "wp-cobb"]
grade = "B"
checked = "2026-11-19"

