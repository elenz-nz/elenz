[facts.about]
value = "Glenbrook-Ohurua Battery is Contact Energy's first grid-scale battery, on land leased from New Zealand Steel at its Glenbrook site in South Auckland, close to Auckland's demand and to the national grid. Its 56 Tesla Megapack units can deliver 100 MW for about two hours, storing 200 MWh. Work began in July 2024, it started trading on 1 April 2026 and was officially opened in May 2026. A second, 200 MW battery is being built beside it, due online in early 2028."
