[facts.about]
value = "This cogeneration plant supplies process steam and electricity to Fonterra's Whareroa dairy site near Hāwera, one of the largest dairy processing sites in the Southern Hemisphere. Its main job is steam: four gas turbines each feed a heat recovery boiler, and the steam drives a steam turbine or goes to the factory, so electricity is a co-product. Running since 1996, it was a Fonterra and Todd joint venture until Fonterra took full ownership in August 2026. Fonterra is adding two 34 MW electric boilers, but the site still needs the plant for the rest of its heat."
source = ["ea-whareroa-2026", "todd-kapuni"]
grade = "B"
