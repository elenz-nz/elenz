[facts.about]
value = "Roxburgh holds back Lake Roxburgh on the Clutha River, about 9 km north of the town of Roxburgh. The government approved it in December 1947, and its first generator ran in 1956: four Canadian-built turbines went in during 1956–57 and four more in 1960–61, giving eight units and 320 MW. Contact is replacing four of the original turbines with more efficient ones made by Voith between 2024 and 2026, which it expects to add about 44 GWh a year from the same water."
source = ["contact-roxburgh", "contact-roxburgh-turbines-2024", "contact-clutha-scheme", "wp-roxburgh-dam"]
grade = "B"
checked = "2026-11-18"

