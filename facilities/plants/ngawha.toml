[facts.about]
value = "Ngāwhā, near Kaikohe, is owned by Top Energy, the Far North's lines company. Its first binary units ran from 1998 and a second station followed in 2008, about 25 MW together. A third, OEC4, built with the Parahirahi Ngāwhā Waiariki Trust and Ngāti Rangi, exported its first power on New Year's Eve 2020 and more than doubled the capacity to 57 MW. The Far North can now meet its own electricity needs for most of the year, sending the surplus to the rest of Northland."
source = ["ngawhagen-opening-2021", "ngawhagen-who-we-are", "nzga-generation-2023", "wp-top-energy"]
grade = "B"
checked = "2026-11-19"

