[facts.about]
value = "Karāpiro is the last station in the Waikato Hydro System, 188 km downstream of Lake Taupō near Cambridge, and its lake is home to New Zealand rowing. Building began in 1940 but was slowed by the Second World War, and its three Kaplan turbines came into service in 1947 and 1948. A $90 million upgrade, finished in September 2025, replaced all three units and raised the station from 96 MW to 112.5 MW."
