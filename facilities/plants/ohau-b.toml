[facts.about]
value = "Ōhau B draws water from Lake Ruataniwha and sends it on by canal to Ōhau C, its twin downstream. The two stations share a design, with four 53 MW units each and similar equipment. Work began in 1977 and Ōhau B was fully running by 1984. After reassessing the station, Meridian raised its maximum operating capacity from 216 MW to 220 MW in July 2026."
