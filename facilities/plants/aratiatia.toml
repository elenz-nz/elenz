[facts.about]
value = "Aratiatia is 13 km downstream of Taupō on the Waikato River and has the smallest reservoir in the Waikato Hydro System. Its dam was built at the top of the Aratiatia gorge rather than the bottom, so the rapids could be kept, and water is let through to flood them several times a day for visitors. The station opened in 1964 with three Francis turbines."
