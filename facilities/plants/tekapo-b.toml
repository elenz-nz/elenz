[facts.about]
value = "Tekapo B sits at the end of the 25.5 km Tekapo Canal on the edge of Lake Pūkaki, using water that has already passed through Tekapo A. It was built from 1970 and opened in 1977, before the Upper Waitaki works raised the lake around it; Genesis says it is the only New Zealand power station finished with water all around it. Its two 80 MW units make it the larger of the two Tekapo stations, which Genesis Energy bought from Meridian Energy in 2011."
source = ["genesis-tekapo-intake", "wp-tekapo-b", "genesis-tekapo-sale"]
