[facts.about]
value = "This cogeneration plant at the Kinleith pulp and paper mill near Tokoroa burns wood waste to make steam and electricity, most of it used at the mill. ECNZ agreed with the mill's owner, Carter Holt Harvey, in 1995 to build and run it, with Rolls-Royce building the plant, and it began generating in 1997. It passed to Genesis Power when ECNZ was split in 1999. The mill, now Oji Fibre Solutions', stopped making paper in June 2025 but still makes pulp."
source = ["gazette-1999-37", "wp-kinleith-mill", "wp-list"]
grade = "B"
checked = ""
note = "not published until the owner and its current running are settled (to_check)"

