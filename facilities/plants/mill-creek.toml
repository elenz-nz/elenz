[facts.about]
value = "Mill Creek is in the hills above the Ōhāriu Valley, north-west of Wellington, on private farms whose owners chose wind farming over a housing subdivision or forestry and picked Meridian to build it. Plans for 31 turbines were cut to 26 by the Environment Court in 2011. Building began in 2012, with about 800,000 cubic metres of earthworks and 19 km of tracks, and the 26 turbines (59.8 MW) were fully running in 2014, feeding the grid at Transpower's Wilton substation."
source = ["meridian-mill-creek", "wp-mill-creek"]
grade = "B"
