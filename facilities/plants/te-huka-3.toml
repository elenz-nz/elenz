[facts.about]
value = "Te Huka 3 is a binary plant built at Te Huka, on the Tauhara geothermal field near Taupō, beside the station's two original units. Geothermal fluid heats pentane, which drives the turbine, and the plant was designed to put all its potential emissions back into the reservoir, making it one of the first geothermal stations built to be carbon neutral. Microsoft agreed to buy its renewable energy attributes for ten years, which helped Contact decide to build it, and it first supplied the grid in October 2024."
source = ["thinkgeo-te-huka-3-2024", "contact-microsoft-2023", "nzga-tauhara"]
grade = "B"
checked = "2026-11-19"

