[facts.about]
value = "Harapaki runs along the Maungaharuru Range in Hawke's Bay, about 35 km north-west of Napier. Meridian built it over three years through three cyclones, Covid-19 and supply-chain delays, finishing in July 2024 within a month of the original date and within its $448 million budget. Its 41 turbines can produce up to 176 MW; a foundation design that needed less concrete and an on-site concrete plant cut truck trips from Napier."
