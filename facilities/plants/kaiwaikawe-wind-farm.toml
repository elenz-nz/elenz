[facts.about]
value = "Kaiwaikawe Wind Farm is 12 km north-west of Dargaville in Northland and 3 km inland from the Tasman Sea, with its 12 turbines in two clusters. They are Vestas V162 machines of 6.4 MW, 206 m to the blade tip, the first of their kind built in New Zealand and its largest and tallest wind turbines. Tilt Renewables first proposed it, as Omamari, and Mercury took it over in 2021; it first generated in July 2026, sending its power through Northpower's substation near Dargaville to the grid at Maungatapere."
source = ["mercury-kaiwaikawe", "wp-kaiwaikawe"]
grade = "B"
checked = "2026-11-19"

