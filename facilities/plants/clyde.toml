[facts.about]
value = "Clyde holds back Lake Dunstan on the Clutha River and is New Zealand's largest concrete gravity dam, with about a million cubic metres of concrete in the dam and another 200,000 in the powerhouse. The government chose a high dam at Clyde in 1976 and passed special legislation in 1982 to get it built. The dam was finished in 1990, but extensive work to stabilise the Cromwell Gorge, which the lake would fill, held up commissioning until 1992. Built to produce 432 MW from its four units, the station is now rated at 464 MW."
source = ["contact-clyde", "teara-hydro-4", "paperspast-press-1988-12-08"]
grade = "B"
checked = "2026-11-18"

