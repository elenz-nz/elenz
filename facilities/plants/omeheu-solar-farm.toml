[facts.about]
value = "Omeheu is a solar farm on 30 hectares of farmland on the outskirts of Edgecumbe in the Bay of Plenty, owned by Aquila Clean Energy APAC. Its 63,000 or so panels sit on fixed frames in east-west rows, like a shallow A-frame roof, so one side catches the morning sun and the other the afternoon. It feeds the grid through the nearby Edgecumbe substation and was switched on in mid-2026. Te Rūnanga o Ngāti Awa gifted the name in March 2024."
source = "omeheu-site"
grade = "A"
checked = "2026-11-19"

