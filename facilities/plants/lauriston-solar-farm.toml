value = "Lauriston is a solar farm on 93 hectares of leased farmland on the Canterbury Plains near Ashburton, developed by a joint venture of Genesis Energy and FRV Australia. Its 90,000 or so panels reached full output in February 2025, and the land is still grazed by sheep. It is expected to produce up to 100 GWh a year. When it opened in April 2025, Genesis described it as the country's largest solar farm."
