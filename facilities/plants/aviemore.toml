[facts.about]
value = "Aviemore was approved in October 1962 and fully running by 1968, completing the mid-Waitaki scheme with Benmore upstream and Waitaki below. Its dam is built in two parts, one of earth and one of concrete. The station's four 55 MW generators are physically the largest in New Zealand, with rotors almost 8 m across weighing 210 tonnes, and its 7 m penstocks are also the country's largest."
