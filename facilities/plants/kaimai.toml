[facts.about]
value = "The Kaimai scheme gathers water from the Wairoa River and its tributaries on the Bay of Plenty side of the Kaimai Range and runs it through small storage lakes, canals and tunnels to four power stations. It grew out of Tauranga's own electricity undertakings: a joint committee of the city and the power board built Lloyd Mandeno, named after the engineer who brought electricity to the district, in 1972, then Lower Mangapapa in 1979 and Ruahihi in 1981. Releases from the Lake McLaren dam on up to 26 days a year give white-water kayakers and rafters high flows."
source = ["contact-kaimai", "wp-manawa-energy"]
grade = "B"
checked = "2026-11-19"

