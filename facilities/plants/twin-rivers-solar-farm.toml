value = "Twin Rivers is Rānui Generation's first solar farm, on a 34-hectare site near Kaitāia in the Far North, between the Victoria and Takahue rivers. Its 55,832 panels feed Top Energy's network, sheep graze the site, and an urupā on the land is protected by covenant. It was developed with Te Paatu and commissioned in December 2025."
