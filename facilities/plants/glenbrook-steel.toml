[facts.about]
value = "The Glenbrook Power Station is a cogeneration plant built into New Zealand Steel's mill at Glenbrook, south of Auckland. It generates electricity from surplus gas from the mill's iron-making kilns, cutting the mill's energy costs and the electricity it buys from the market. The first of its two plants was commissioned in 1987 and the second in 1997."
