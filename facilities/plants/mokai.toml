[facts.about]
value = "Mōkai, about 30 km northwest of Taupō, is majority-owned by the Tūaropaki Trust, with Mercury holding a quarter. It opened in 2000 as a 55 MW station and was enlarged in 2005 and again in 2007–08 to about 113 MW. It combines steam turbines with binary units, which make more electricity from the heat left in the fluid, and all the geothermal fluid goes back into the field. The field's heat also warms a large glasshouse and the Miraka milk-powder factory."
source = ["mercury-mokai", "nzga-mokai", "wp-mokai"]
grade = "B"
checked = "2026-11-19"

