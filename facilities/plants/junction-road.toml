value = "Junction Road is a 100 MW gas-fired peaking plant about 7 km south of New Plymouth, near State Highway 3. Its two 50 MW gas turbines can reach full output in 15 minutes and are used when demand is high or other generation isn't available. Built by Todd Generation, it went into commercial operation in May 2020, and Nova Energy took over its operation in 2022."
