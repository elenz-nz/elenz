[facts.about]
value = "Te Mihi draws steam from the western side of the Wairākei geothermal field, where the field's main upflow of hot fluid lies, and was built to take over gradually from the ageing Wairākei station nearby. Its two Toshiba steam turbines began generating in 2014; some of Wairākei's steam was moved to the new plant, so the field's total output rose. Contact is now building Te Mihi Stage 2, a 101 MW binary plant on the same field, due online in 2027 as the next step in replacing Wairākei."
source = ["nzga-wairakei", "wp-te-mihi", "contact-te-mihi", "contact-wairakei-2024"]
grade = "B"
checked = "2026-11-19"

