[facts.about]
value = "Waipipi stands on coastal farmland between Pātea and Waverley in South Taranaki. Trustpower took over the project in 2010, and Tilt Renewables, its wind spin-off, built it from late 2019 with 31 Siemens Gamesa turbines of 4.3 MW, then the largest in New Zealand. The first turbines fed the grid in November 2020 and all were running by March 2021; Genesis Energy buys its output under a 20-year agreement. Mercury bought it, with Tilt's other New Zealand wind farms, in August 2021."
source = ["wp-waipipi", "tilt-waipipi-2019", "genesis-waipipi-2021", "nzx-announcements-376610"]
grade = "B"
