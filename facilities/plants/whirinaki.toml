  "156 MW from Apr 2004.",
  "Thermal batch 1 (19 Nov 2026): facts checked against Contact's Whirinaki page, the EA register, Wikipedia's Whirinaki Power Station article, the Gazette (ECNZ's sale of the earlier station to Contact) and Stats NZ boundaries. The location is left for the LINZ aerial check.",
  "District and region from the station's point (Wikidata, not yet checked) and the grid connection point in Stats NZ's boundaries, 19 Nov 2026: both Hastings District. \"Area Outside Territorial Authority\" (the sea) is within 1 km and Napier City within 5 km.",
  "Capacity: Contact's page says 155 MW in its text and 156 MW in its figures; the EA register 156 MW to Nov 2023, then three units of 52 MW (156 MW).",
  "The earlier station on the site (NZED, 1978): four twin-pack units with Pratt & Whitney FT4 gas turbines, 220 MW, burning diesel and seldom run; one unit moved to the Te Awamutu dairy factory cogeneration plant in 1993 and the other three were sold to Australia in 2001 (Wikipedia). It was among the stations ECNZ sold to Contact on 1 Feb 1996 (Gazette 1996-174). Before Elenz's data begins (a few hours at WHI2201 in 1997–2000 have no known plant: plant_capacity.csv note).",
  "LINZ aerial check (18 Nov 2026): station point read from the aerial, grid connection point moved to the substation.",
  "Commissioned date rule (21 Nov 2026): first metered day 2004-04-05, from WHI2201 whirinaki: the station first ran on 5 Apr 2004 (52 MW). The same code shows small amounts between Aug 1997 and May 2000 (see to_check). The previous value moved to alt.",
  "Early readings (design decision 21 Nov 2026): the Generation_MD code WHI2201 whirinaki shows small amounts between Aug 1997 and May 2000 (up to 323 MWh in a month), before this station was built. Probably the earlier Whirinaki station ECNZ sold to Contact in 1996 (gazette-1996-174), or testing. Ignored for now: the commissioned date stays at the station's first metered day (5 Apr 2004) and the history months are left as they are.",
  "Concept Consulting's thermal overview for the EA (concept-2023-thermal, 23 Nov 2026): Whirinaki 155 MW (3 x 52), diesel, 2004, government-built and sold to Contact in 2011.",
  "Team notes (23 Nov 2026): the team's Beehive release (the opening, 1 June 2004) and a NZ Herald list of sites can't be fetched here; the same release is on Scoop (scoop-whirinaki-2004), and the Government's December 2010 sale release and RNZ's report on the $33 million sale back the Crown ownership (scoop-whirinaki-2010, rnz-whirinaki-sold).",
]

