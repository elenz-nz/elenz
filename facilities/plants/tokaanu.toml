[facts.about]
value = "Tokaanu is the largest station in the Tongariro Power Scheme, at the foot of Mount Tihia near the southern end of Lake Taupō. Commissioned in 1973, it takes water from all four of the scheme's catchments: gathered in Lake Rotoaira, it runs through a 6.1 km tunnel to the station's four 60 MW units and then down a 3.8 km tailrace into Lake Taupō."
source = "genesis-tongariro"
