[facts.about]
value = "Te Uku sits on the Wharauroa Plateau near Raglan, on a working sheep and cattle farm that rises above 400 m. It was built as an alliance with the community-owned lines company WEL Networks: Meridian built and runs the 28 turbines, and WEL built the 25 km, 33 kV line that carries their power to its network and the grid. The first turbine went live in November 2010, and the Prime Minister formally switched the wind farm on in February 2011."
