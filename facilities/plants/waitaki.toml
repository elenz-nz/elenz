[facts.about]
value = "Waitaki was the first station of the Waitaki scheme, begun in 1928 as a Depression \"make work\" project. Dug almost entirely by pick and shovel, it was the last New Zealand station built without modern machinery, and its first two 15 MW units, running from 1935, could meet nearly half the South Island's needs. Five more units followed by 1954. In 2026 Meridian began a $440–510 million upgrade, due by 2036, that will replace all seven and take the station from 105 MW to 120 MW."
source = ["meridian-waitaki", "meridian-waitaki-scheme", "nzx-meridian-waitaki-upgrade"]
grade = "A"
checked = "2026-11-18"

