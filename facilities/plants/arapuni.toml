[facts.about]
value = "Arapuni is the oldest station in the Waikato Hydro System. It opened in 1929 behind the first high dam the government built on the Waikato River, a listed heritage item today. Its eight Francis turbines came in stages, the last two in 1946, and Mercury replaced units 5 to 8 in 2012 and 2013."
