[facts.about]
value = "Matahina's 86 m earth dam across the Rangitāiki River, inland from Whakatāne, is the largest dam of its kind in the North Island and holds back Lake Matahina. The Ministry of Works began the scheme in 1960 on difficult, faulted ground, and its two generators came into service in 1967. It is the lowest of the river's three hydro schemes, below Wheao and Flaxy and Aniwhenua. The Waiohau fault runs beneath the dam, which has since been strengthened against a large earthquake."
source = ["contact-matahina", "wp-matahina"]
grade = "B"
checked = "2026-11-19"

