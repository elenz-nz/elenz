[facts.about]
value = "Deep Stream is a small scheme above the Waipori scheme west of Dunedin, commissioned in 2008: two stations on a canal from an existing diversion of Deep Stream, which release the water into Lake Mahinerangi, where the Waipori stations use it again. Elenz's data for this plant, the EA register's Deep Stream (Waipori A), also covers Waipori 1A, the top station of the Waipori scheme, built in the 1960s and 1970s just upstream of the scheme's original 1907 station."
