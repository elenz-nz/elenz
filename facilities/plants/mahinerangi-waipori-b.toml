[facts.about]
value = "Mahinerangi Wind Farm stands on farmland above Lake Mahinerangi, about 50 km west of Dunedin, at 600 to 730 m above sea level. Trustpower won consent in 2007 for up to 100 turbines and 200 MW, and built a first stage of 12 Vestas turbines (36 MW) in 2011, which feeds its power into the nearby Waipori hydro scheme's lines. Mercury, which bought it in 2021, began building a 192 MW second stage, Puke Kapo Hau, in November 2026."
source = ["wp-mahinerangi", "mercury-mahinerangi"]
