[facts.about]
value = "Coleridge, in inland Canterbury, was the New Zealand Government's first major hydro scheme, built from 1911, largely by hand, to supply Christchurch, and running from 1914. It needs no dam: Lake Coleridge is a natural lake about 165 m above the powerhouse, and its water reaches the turbines through tunnels and steel penstocks, then flows into the Rakaia River. Diversions of the Harper, Acheron and Wilberforce rivers later added water to the lake. Five units run today, after a refurbishment finished in 2008."
source = ["contact-coleridge", "wp-coleridge"]
grade = "B"
checked = "2026-11-19"

