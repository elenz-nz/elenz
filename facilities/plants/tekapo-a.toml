[facts.about]
value = "Tekapo A stands at the southern end of Lake Tekapo, the first of the eight stations in the Waitaki hydro scheme. Work on it began in 1938 but stopped during the Second World War, and it opened in 1951. Its outflow now runs down the 25.5 km Tekapo Canal to Tekapo B, so the same water generates twice. Meridian Energy sold both Tekapo stations to Genesis Energy on 1 June 2011."
source = ["genesis-tekapo-intake", "wp-tekapo-a", "genesis-tekapo-sale", "meridian-waitaki-scheme"]
grade = "B"
checked = "2026-11-18"

