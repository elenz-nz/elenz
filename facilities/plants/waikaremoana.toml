[facts.about]
value = "The Waikaremoana Power Scheme in northern Hawke's Bay runs water from Lake Waikaremoana through three stations in turn: Kaitawa, Tuai and Piripaua. Tuai opened first, in 1929, making this the North Island's second government hydro scheme after Mangahao; Piripaua followed in 1943 and Kaitawa last. Kaitawa was the first to draw straight from the lake, through tunnels in the ancient landslide dam that formed it; before then the stations used only the water that leaked or spilled out. Tuai has the highest head and makes the largest share of the scheme's power."
source = "genesis-waikaremoana"
grade = "A"
checked = "2026-11-18"

