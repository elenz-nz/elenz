[facts.about]
value = "Poihipi was built in the 1990s on the south-western edge of the Wairākei geothermal field, one of several independent geothermal developments that followed the opening of the electricity market. It drew on a thin steam zone through just four wells, and the venture failed for lack of steam; Contact bought the station in 2000. Contact linked it to the main Wairākei steamfield in 2006, and it now runs as part of that system with Te Mihi and Wairākei."
source = ["nzga-wairakei", "contact-poihipi"]
grade = "B"
checked = "2026-11-19"

