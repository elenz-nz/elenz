value = "Papareireiā is a solar farm on farmland near Maungaturoto in the Kaipara, built to supply Ryman Healthcare's retirement villages under a 10-year agreement. It is a joint venture of Tupu Tonu (the Ngāpuhi Investment Fund), Purpose Capital and Harbour Infrastructure. Construction began in late 2024 and the farm was commissioned in December 2025. Its name refers to the sun's rays being taken in by the land."
