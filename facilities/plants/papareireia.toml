[facts.about]
value = "Papareireiā is a solar farm on farmland near Maungaturoto in the Kaipara, built to supply Ryman Healthcare's retirement villages under a 10-year agreement. It is a joint venture of Tupu Tonu (the Ngāpuhi Investment Fund), Purpose Capital and Harbour Infrastructure. Ryman's supply is sleeved through Mercury, which tops it up when the sun is low. Construction began in late 2024 and the farm officially went live on 4 December 2025; it is expected to produce about 32 GWh a year. Its name refers to the sun's rays being taken in by the land."
source = ["teao-papareireia", "wp-papareireia", "ryman-papareireia-live"]
grade = "B"
checked = "2026-11-21"

