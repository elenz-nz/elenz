[facts.about]
value = "Ōtāhuhu A was the first power station on the Ōtāhuhu site in south Auckland: four 45 MW open cycle gas turbines commissioned in 1968, joined by two more twin-pack units in 1978. After it stopped generating, its machines were kept running to supply reactive power to the national grid, until they were retired and decommissioned in 2013. Ōtāhuhu B, a combined cycle station, was built beside it."
source = ["wp-otahuhu", "ea-register"]
grade = "B"
checked = "2026-11-19"

