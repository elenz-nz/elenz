[facts.about]
value = "Aniwhenua is the middle of three hydro schemes on the Rangitāiki River in the eastern Bay of Plenty, between Murupara and Whakatāne. A 10 m barrage above the Aniwhenua Falls turns the river into a 2.2 km concrete-lined canal and a head pond, from which two buried penstocks feed the power station beside the falls. The Bay of Plenty Electric Power Board built it under a government scheme of the late 1970s that helped local bodies develop small hydro, and it began generating in October 1980. Nova Energy owned it from 1998 until 2016, when it passed to a partnership that Pioneer Energy has wholly owned since 2024."
source = ["pioneer-aniwhenua", "wp-aniwhenua-power-station", "pioneer-history"]
grade = "B"
