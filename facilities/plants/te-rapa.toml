[facts.about]
value = "Te Rapa was a gas-fired cogeneration plant at Fonterra's dairy factory at Te Rapa, near Hamilton, commissioned in 1999. Its gas turbine made electricity, and its exhaust heat raised steam for the factory. Plans for a 150 MW plant were cut to about 45 MW in 1997 after opposition over its emissions and the Waikato River. Contact closed it in 2023, when its contract to supply Fonterra ended."
source = "wp-te-rapa"
grade = "B"
checked = "2026-11-19"

