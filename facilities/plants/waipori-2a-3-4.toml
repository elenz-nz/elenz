[facts.about]
value = "The Waipori scheme, in the hills west of Dunedin, began as a private company's plan to power gold dredges. Dunedin City Council bought it while it was being built, in 1904, and power reached the city on 27 April 1907. Lake Mahinerangi, formed by a dam finished in 1931 and raised by 1946, now stores the water, which drops through a steep gorge to four stations. The council sold the scheme to TrustPower in 1998 under the electricity reforms. Elenz's figures for this plant cover Waipori 2A, 3 and 4, as the EA register groups them."
source = ["trustpower-waipori-2007", "contact-waipori", "wp-lake-mahinerangi", "ea-register"]
