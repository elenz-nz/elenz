[facts.about]
value = "McKee is a 100 MW gas-fired peaking plant at Todd Energy's McKee Production Station on Tariki Road, east of Inglewood in north Taranaki. Its two gas turbines can reach full output in 15 minutes, and Nova Energy uses it to supply electricity when demand is high or other generation isn't available. It has run since 2012 and was officially opened in March 2013."
