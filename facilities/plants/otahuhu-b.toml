[facts.about]
value = "Ōtāhuhu B was a natural gas combined cycle station in south Auckland, beside the older Ōtāhuhu A gas turbines and commissioned in January 2000. A single gas turbine and steam turbine shared one shaft, cooled by a hybrid wet and dry cooling tower using sea water. Rated at 385 MW at first, it reached about 404 MW after upgrades in 2005. It stopped generating at the end of September 2015, and Contact sold the site in 2016."
source = "wp-otahuhu"
grade = "B"
checked = "2026-11-19"

