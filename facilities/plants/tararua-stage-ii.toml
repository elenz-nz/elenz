[facts.about]
value = "Tararua Wind Farm stands on about 700 hectares of farmland on the Tararua Range east of Palmerston North, built in three stages. Stage II added 55 more Vestas V47 turbines of 660 kW in 2004, the first wind farm Trustpower's own team built, bringing stages I and II to 103 turbines and 68 MW; they feed Powerco's Palmerston North network through twin 33 kV lines. The farm passed from Trustpower to Tilt Renewables in 2016 and to Mercury in 2021."
source = ["mercury-tararua", "tilt-tararua-2020", "wp-tararua-wind-farm"]
grade = "B"
checked = "2026-11-19"

