[facts.about]
value = "Kohirā is Lodestone Energy's first solar farm, on farmland near Kaitāia in the Far North. Its 61,000 or so bifacial panels track the sun through the day, and the land beneath them is still farmed. It started generating in November 2023 and is expected to produce about 56 GWh a year. Local iwi gifted the name, which means \"suncatcher\"."
source = ["bt-kohira", "lodestone-solar-farms"]
