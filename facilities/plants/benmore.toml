[facts.about]
value = "Benmore holds back Lake Benmore, New Zealand's largest artificial lake, behind the country's largest earth dam; it was first planned in concrete, like Waitaki. Approved in October 1957 together with the Cook Strait power cable, it was built from 1958, the lake filled in December 1964 and the first power came in January 1965. It is New Zealand's second-largest hydro station after Manapōuri, and Meridian raised its maximum operating capacity to 570 MW in July 2026."
source = ["meridian-benmore", "meridian-waitaki-uprate"]
