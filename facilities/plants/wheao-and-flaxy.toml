[facts.about]
value = "Wheao and Flaxy are two linked power stations in the Kaingaroa Forest, on the upper Rangitāiki River, the furthest upstream of the river's three hydro schemes. Three dams and two canals gather water from the Rangitāiki and Wheao rivers and Flaxy Stream for the two stations. The scheme was commissioned in 1982, and its Rangitāiki canal is now a good trout fishery."
