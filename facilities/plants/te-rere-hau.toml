  "Transpower's Assumptions Book v3.0, Appendix F (model inputs of 4 Jun 2026; source transpower-assumptions-2026): 46 MW now, repowered to 170 MW in 2030 (sheet 5b).",
  "Commissioned date rule (21 Nov 2026): first metered day 2006-09-01, from embedded meter TRH0111: readings of a few kWh from 29 Aug 2006, the first 1 MWh day 1 Sep 2006; the tracker's own series for Te Rere Hau starts at TWC2201 in Sep 2008. The previous value moved to alt.",
