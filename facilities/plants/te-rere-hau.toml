value = "Te Rere Hau is on the Tararua Range about 11 km east of Palmerston North. NZ Windfarms built it in four stages from 2006 to 2011 with 97 two-bladed Windflow 500 turbines of 500 kW, designed and made in New Zealand, which set it apart from its neighbours. Meridian, already its partner in a plan to replace them with far larger turbines, bought NZ Windfarms in July 2025."
