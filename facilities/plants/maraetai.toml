[facts.about]
value = "Maraetai is two powerhouses, Maraetai I and II, fed by one concrete arch dam and run as one station; together they have the largest capacity in the Waikato Hydro System. Maraetai I opened in 1952. Work on Maraetai II began in 1959, stopped in 1961 when the government put the Cook Strait cable first, and finished in 1970, the last of the Waikato stations to be built."
source = "mercury-maraetai"
grade = "A"
