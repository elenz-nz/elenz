[facts.about]
value = "The Roaring Meg scheme has two small stations in the Kawarau Gorge between Cromwell and Queenstown, fed from a dam on the Roaring Meg stream, which is said to be named after a gold-rush barmaid. The Otago Central Electric Power Board built the lower station with money advanced by two gold-dredging companies, and it opened in March 1936; workers drilled the rock by hand and hauled the pipes up the hill on a tramline. The upper station, below a concrete arch dam at the head of the valley, followed in 1947 despite wartime shortages, floods and snow."
source = ["pioneer-roaring-meg", "wp-roaring-meg"]
grade = "B"
checked = "2026-11-19"

