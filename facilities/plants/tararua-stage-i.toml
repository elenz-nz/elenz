[facts.about]
value = "Tararua Wind Farm stands on about 700 hectares of farmland on the Tararua Range east of Palmerston North, built in three stages. Stage I, 48 Vestas V47 turbines of 660 kW on 40 m lattice towers, reached commercial operation on 24 December 1999, when it was the largest wind farm in the southern hemisphere, and its turbines have kept running well past their 20-year design life. Trustpower owned it from then until its wind farms passed to Tilt Renewables in 2016; Mercury bought it in 2021."
source = ["mercury-tararua", "tilt-tararua-2020", "wp-tararua-wind-farm"]
grade = "B"
checked = "2026-11-19"

