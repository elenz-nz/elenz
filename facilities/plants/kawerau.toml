[facts.about]
value = "Kawerau was New Zealand's biggest geothermal project in 20 years when Mighty River Power, now Mercury, opened it in 2008, on a field that has supplied steam to the town's mills since 1957. Fluid from wells about 2 km away is separated twice, giving high- and low-pressure steam for a single turbine, and the used fluid is injected back into the ground north of the field. Built for 90 MW, it soon proved able to run at about 100 MW, and Mercury now gives its installed capacity as 107 MW."
source = ["powermag-kawerau-2009", "nzga-kawerau", "mercury-kawerau", "wp-kawerau"]
grade = "B"
checked = "2026-11-19"

