value = "Rotohiko is a grid-scale battery near Huntly power station, built for WEL Networks' NewPower Energy, which owns, runs and trades it. It can deliver 35 MW for an hour, storing 35 MWh, and connects through WEL Networks' local network rather than directly to the national grid. Commissioned in 2023, it began charging and discharging into the grid in 2024, and has mostly been dispatched to stand by as instantaneous reserve rather than for energy."
