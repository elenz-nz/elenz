[facts.about]
value = "Rangipō was New Zealand's second underground power station: it sits 63 m below ground, built there to keep it out of sight of the Tongariro River. Water from the Whangaehu, Moawhango and Tongariro catchments reaches it by tunnel from a head pond at Rangipō Dam, and a 3 km tailrace tunnel returns it to the river. Its two 60 MW units were commissioned in 1983, the second station of Genesis's Tongariro Power Scheme after Tokaanu."
source = "genesis-tongariro"
grade = "A"
