[facts.about]
value = "The Branch River scheme, in the Wairau Valley in inland Marlborough, is a run-of-river scheme with two power stations. Water taken from the Branch River runs along a race to the Argyle powerhouse, then through a storage pond, Lake Argyle, and a second race to the Wairau powerhouse, which discharges into the Wairau River. The Marlborough Electric Power Board built it, gaining the government's consent to generate in March 1983. Lake Argyle and the Branch and Leatham rivers are popular with anglers."
source = ["contact-branch-river", "library-1983-1983-20issue-20071", "mfe-wairau-2009"]
