notes = [
  "The EA register names it \"Branch River (Arnold)\" at ARG1101 (12 MW); the metered code is argyle_wairau, so the scheme is Argyle plus Wairau. Arnold is a separate West Coast station (E020; Contact: Arnold River, 3 MW). The page's name drops \"(Arnold)\" (19 Nov 2026); the tracker's plant name is unchanged.",
  "Hydro batch 5 (19 Nov 2026): facts checked against Contact's scheme page, the Gazette (the 1983 consent to generate), the Ministry for the Environment's 2009 review, the EA register and network supply points table, Wikipedia and Stats NZ boundaries. The location is left for the LINZ aerial check.",
  "District and region from Argyle station's Wikidata point in Stats NZ's 2026 district and 2025 region boundaries, 19 Nov 2026. The grid connection point gives the same. No other district within 5 km.",
  "Station points (22 Nov 2026): Argyle is the plant point; the Wairau powerhouse [-41.64828, 173.22418] was read from the LINZ aerial (penstock from its headpond, the building, and the tailrace to the Wairau River, about 3.9 km down the race from Argyle, as the 1983 consent says: a 3,885 m race and a 950 m tailrace).",
  "Resolved: Capacity: the 1983 consent gives Argyle 3.8 MW and Wairau 7.2 MW (11 MW, as Contact says); the register has 12 MW (Elenz); Wikipedia's list's 3.8 is Argyle alone. Contact's 11 is a rating.",
  "Wikipedia's river article says commissioned in 1983 and completed in 1984. The Ministry for the Environment's review says a scheme has existed in the valley since about 1973; not used.",
  "LINZ aerial check (18 Nov 2026): station point confirmed, grid connection point confirmed.",
  "Team's source links (22 Nov 2026), not yet read (the first two can't be fetched from our research tools): the Ministry for the Environment's scheme proposal (environment.govt.nz/assets/Publications/Files/proposal.pdf); the Envirolink report on the scheme's effect on low flows in the Wairau River (envirolink.govt.nz/assets/Envirolink/2232-MLDC164-...pdf); Infratil's 2023 investor day Manawa update (the intake upgrade); Marlborough Lines' history page (marlboroughlines.co.nz/our-story), which has the 1983 flood that took out temporary installations.",
  "Marlborough Lines' history page, read in Chrome (23 Nov 2026): Wairau powerhouse generating from 22 Jun 1983 and Argyle from 16 Aug 1983; the power board was corporatised as Marlborough Electric; its generation was sold under the Bradford reforms. Agrees with the previous-owners fact. The Ministry's proposal PDF is the 2009 review already used (mfe-wairau-2009); the Envirolink report (June 2022) adds only that the scheme is run of river with minor storage, two stations, 54.3 GWh a year average output; Manawa's FY23 results (nzx-manawa-fy23) say asset enhancement work at Branch River was complete and a 28 MW solar farm beside Argyle was proposed. Nothing changed in the facts.",
]

