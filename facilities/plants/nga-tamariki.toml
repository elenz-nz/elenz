[facts.about]
value = "Ngā Tamariki, 17 km northeast of Taupō on the Wairakei Pastoral Estate, opened in 2013 with four Ormat binary units, at the time the largest of their kind in the world. In a binary plant the geothermal fluid heats a separate working fluid that drives the turbines, and the cooled fluid goes back into the reservoir. Ngā Tamariki also pumps its non-condensable gases, mostly carbon dioxide, back underground, which Mercury was the first New Zealand generator to do. A fifth unit, built from May 2024, began supplying the grid in January 2026 and lifted capacity from 86 MW to 132 MW."
source = ["mercury-nga-tamariki", "mercury-geothermal", "nzga-ngatamariki"]
grade = "B"
checked = "2026-11-19"

