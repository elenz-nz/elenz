[facts.about]
value = "Ōhau C takes water that has already passed through its twin, Ōhau B, and releases it into Lake Benmore. Work began in 1979, and when it was fully running in 1985 it was the last station of the Waitaki scheme, completing the work that began with the Waitaki dam in 1928. Like Ōhau B it has four 53 MW units; after reassessing the station, Meridian raised its maximum operating capacity from 212 MW to 220 MW in July 2026."
source = ["meridian-ohau-c", "meridian-waitaki-uprate"]
grade = "A"
checked = "2026-11-18"

