[facts.about]
value = "Te Puna Mauri ō Omaru is a solar farm at Ruawai in the Kaipara, owned by Northpower, which describes it as one of New Zealand's first large-scale community-owned solar farms. Its first stage was finished in December 2024, and an extension in July 2025 took it to about 20 MW of panels. Te Uri o Hau gifted the name, which means \"the energy source of Omaru\" (safe haven), the original name of this land."
source = ["northpower-ruawai", "bt-ruawai"]
grade = "A"
checked = "2026-11-19"

