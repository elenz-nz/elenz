[facts.about]
value = "The Stratford site east of Stratford has held three gas-fired stations. Four gas turbines ran here from 1976 until 2001; the Taranaki Combined Cycle unit, cooled with water from the Pātea River, ran from 1998 until it reached the end of its life in 2026; and two fast-start peakers, opened in 2011, remain. The peakers can go from a cold start to full output in about ten minutes, to cover peaks in demand and complement hydro and wind generation."
source = ["wp-stratford", "contact-cdc-2026", "contact-stratford-peakers", "contact-tcc-2022"]
grade = "B"
checked = "2026-11-19"

