[facts.about]
value = "Southdown was a gas-fired combined cycle cogeneration station in the Southdown industrial area of south Auckland, commissioned in December 1996. Besides electricity it piped steam to nearby industry, including a paper recycling mill. A third gas turbine was added in 2007. Mighty River Power closed it at the end of 2015, and it was demolished between 2022 and 2024."
source = "wp-southdown"
