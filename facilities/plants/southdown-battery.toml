[facts.about]
value = "Southdown Battery was a 1 MW Tesla Powerpack, storing 2 MWh, that Mercury installed at its research and development centre in South Auckland, connected to the grid at Southdown. Launched in August 2018, it was, in Mercury's words, the first large-scale battery in New Zealand connected directly to the national grid. Mercury ran it as a trial of how a battery could trade in the electricity market and work alongside its hydro and geothermal stations. The EA's register lists it until May 2022."
source = ["mercury-battery-2018", "seanz-mercury-tesla-2018", "ea-register"]
