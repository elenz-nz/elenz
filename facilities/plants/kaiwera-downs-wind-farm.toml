[facts.about]
value = "Kaiwera Downs Wind Farm is on a plateau about 15 km south-east of Gore in Southland, a site with strong, steady south-westerly winds. Trustpower won consent for it in 2008, and Mercury, which bought the project in 2021, built a first stage of 10 Vestas turbines (43 MW) from 2022 and opened it in November 2023. Stage 1 sends its power to Transpower's Gore substation through an 18 km, 33 kV line; a second stage of 36 turbines followed in 2026."
source = ["mercury-kaiwera-downs", "mercury-kaiwera-downs-factsheet", "wp-kaiwera-downs"]
