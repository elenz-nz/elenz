[facts.about]
value = "Huntly, on the Waikato River, is New Zealand's largest power station by capacity, and its Rankine units are its original part. Built as four 250 MW steam units able to burn either gas or coal, they were commissioned between 1982 and 1985. One unit was decommissioned in 2014 and three remain, run for baseload, to back up the hydro lakes in dry years, and for peaks. Genesis had planned to retire one of them in early 2026; in November 2025 the Commerce Commission authorised an arrangement under which Mercury, Meridian and Contact share its costs, keeping it available to the end of 2035."
source = ["genesis-huntly", "ea-register", "comcom-2025-nzcc-22"]
grade = "A"
checked = "2026-11-21"

