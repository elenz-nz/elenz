[facts.about]
value = "TG1 and TG2 were two small binary plants on the Kawerau geothermal field, which made electricity from hot geothermal water using the Ormat binary cycle. TG1, New Zealand's first binary plant, started in 1989 and TG2 followed in 1993. Both were air-cooled, so their output dipped in warm weather. TG1 was retired in 2014 and TG2 in 2017."
source = ["nzga-generation-2023", "wp-kawerau"]
