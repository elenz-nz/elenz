value = "Rangitaiki is Lodestone Energy's second solar farm, on the Rangitaiki Plains near Edgecumbe in the Bay of Plenty. About 59,600 bifacial panels track the sun, and the land is still farmed. It started generating in March 2024. Ngāti Awa gifted the name, after the plains and the river."
