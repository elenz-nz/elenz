[facts.about]
value = "Rotokawa stands on the Rotokawa geothermal field, 14 km northeast of Taupō, beside the larger Ngā Awa Pūrua. It is a combined-cycle plant: a steam turbine runs first, and binary units then make more electricity from the heat that is left. It opened in 1997 at about 25 MW, gained a 6 MW turbine in 2003 and has been upgraded since, to 34 MW. Its steamfield is shared with the Tauhara North No. 2 Trust."
