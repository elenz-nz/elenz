[facts.about]
value = "Highbank, on the south bank of the Rakaia River in mid Canterbury, runs on water from the Rangitata Diversion Race, a canal built for irrigation: in summer farms have first call on the water, so the station generates mostly in winter. The Public Works Department built it alongside the race, and it opened in June 1945 with a single generator, then the largest in New Zealand. Since 2010 pumps at the site can lift water from the Rakaia back up the penstock into the race for irrigators. The 1945 unit is now being replaced, and the pumps have been run as small turbines in the meantime."
source = ["contact-highbank", "wp-highbank"]
grade = "B"
checked = "2026-11-19"

