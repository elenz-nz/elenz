[facts.about]
value = "Pātea's 82 m earth dam, the fourth highest in New Zealand, holds back Lake Rotorangi, which winds 46 km up the Pātea River valley in South Taranaki and is the country's longest man-made lake. Built between 1980 and 1984 for the Egmont Electric Power Board, it was the first dam made from soft sandstone and siltstone. The station helps eels both ways: a bypass and timed spillway openings for adults heading to sea, and a trap-and-transfer programme for young eels moving upstream."
source = ["contact-patea", "wp-patea-dam"]
grade = "B"
checked = "2026-11-19"

