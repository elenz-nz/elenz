[facts.about]
value = "The Kūmara scheme on the West Coast links three small power stations that have supplied the region since 1928: Duffers, Dillmans and Kūmara. Intakes on the Big Wainihinihi, the Arahura Wainihinihi and Kawhaka Creek collect water in the hills behind the scheme and send it down to Duffers; the Loopline and Kapitea reservoirs then supply Kūmara station. The sheltered Kapitea Reservoir is used for fishing, kayaking and power boating."
source = ["contact-dillmans"]
grade = "B"
