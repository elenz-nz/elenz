  "Resolved: Capacity: 174 MW in the register and from Contact, at peak; the register's figure is what Elenz uses. Contact ran it at about 152 MW at first, with modifications in a later outage to reach 174 MW long term (Wikipedia, citing Contact). Contact's opening announcement says it had run at 160 MW.",
