[facts.about]
value = "Tauhara draws on the Tauhara geothermal field along the eastern edge of Taupō, and its single steam turbine is, Contact says, the largest single-shaft geothermal turbine in the world, spinning at 3,000 revolutions a minute. Building took about three and a half years from 2021, and the cost came to $924 million. It first supplied the grid in May 2024 and was officially opened on 22 November 2024; at up to 174 MW it can meet around 3.5% of New Zealand's electricity needs."
source = ["contact-tauhara", "contact-tauhara-opening-2024", "nzga-tauhara", "wp-tauhara"]
