[facts.about]
value = "Turitea stands on the Tararua Range above Palmerston North, much of it in the city council's Turitea Reserve. The council chose Mercury, then Mighty River Power, to develop it in 2005, and after a long consent process a board of inquiry approved 60 turbines in 2011. The 33-turbine northern stage first generated in July 2021 and the 27-turbine southern stage followed; at 222 MW it was New Zealand's largest wind farm when it opened in May 2023. A 12 km, 220 kV line carries its power to Transpower's Linton substation."
source = ["wp-turitea", "mercury-turitea"]
grade = "B"
checked = "2026-11-19"

