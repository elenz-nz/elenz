[facts.about]
value = "Mangahao, near Shannon in Horowhenua, was the first North Island power station built by the government. Dams in the Tararua Range hold the Mangahao River's water, which runs through tunnels and pipelines to the powerhouse. The Prime Minister, William Massey, opened it in November 1924, after eight men had died building the tunnels, and its lines to Wellington, Palmerston North and Hawke's Bay became the start of the North Island grid. A joint venture of King Country Energy and Todd Energy bought it in 1997, and King Country Energy, now majority-owned by Contact Energy, has owned it outright since 2012."
source = ["contact-mangahao", "kce-our-story", "wp-mangahao"]
grade = "B"
checked = "2026-11-19"

