[facts.about]
value = "Edgecumbe is a gas-fired cogeneration plant at Fonterra's dairy factory at Edgecumbe in the Bay of Plenty, making steam and electricity for the site. It dates from 1996. Its output stops in the EA's metered data after March 2008, but the plant keeps running on site, supplying the factory. In January 2025 Fonterra announced a new electrode boiler for the site, to replace the steam and electricity it gets from the plant."
source = ["fonterra-electrification-2025", "wp-list", "nbr-fonterra-nova-2025"]
grade = "B"
checked = "2026-11-21"
note = "Still running: design decision (21 Nov 2026), until a closing date is confirmed; Transpower models it retiring in 2026."

