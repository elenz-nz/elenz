[facts.about]
value = "Ōhau A, near Twizel in the Mackenzie Basin, stands where the canals from Lakes Ōhau and Pūkaki meet. It was the third station built for the Upper Waitaki scheme: work began in 1971 and its four 66 MW units were fully running by 1979. Building it meant digging about two million cubic metres of rock and gravel from the bank of the Ōhau River. Lake Ruataniwha, which feeds Ōhau B, has a national rowing course that began as the idea of the scheme's project engineer."
