[facts.about]
value = "White Hill stands on forestry land south-east of Mossburn in Southland. It was Meridian's second wind farm and the first in the South Island: building began in 2006, and its 29 turbines, up to 58 MW, were fully running in 2007. While building it, Meridian fenced off ecologically important areas and saved the topsoil and red tussock to put back afterwards."
