[facts.about]
value = "Manapōuri is New Zealand's largest hydro station, built in a cavern about 200 m below Lake Manapōuri's West Arm in Fiordland National Park. About 1,800 workers took eight years to build it: the first power came in September 1969 and all seven units were running by 1972. The water leaves through tailrace tunnels to Deep Cove in Doubtful Sound, and a second tunnel, finished in 2002, let the station reach its full rating, though its consent limits output to 800 MW. Plans in the 1960s to raise the lake by up to 30 m met wide public opposition, a landmark in New Zealand's environmental history."
source = ["meridian-manapouri", "meridian-hydro"]
grade = "A"
checked = "2026-11-18"

