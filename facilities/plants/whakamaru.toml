[facts.about]
value = "Whakamaru, about 40 km north of Taupō, was built from 1949 and began generating in 1956; State Highway 30 runs across the top of its dam. Its four turbines, generators and governors were replaced between 2017 and 2020, raising the station to 124 MW. It is also the main switching point for the upper Waikato's generation on its way north."
